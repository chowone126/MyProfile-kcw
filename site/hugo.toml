baseURL = "https://chowone126.github.io/MyProfile-kcw/"
title = "Chowon's Portfolio"

defaultContentLanguage = "en"

[languages]
  [languages.en]
    label = "KR"
    weight = 1
    title = "Chowon's Portfolio"

    [[languages.en.menus.main]]
        identifier = "about"
        name = "About"
        pageRef = "about"
    [[languages.en.menus.main]]
        identifier = "archives"
        name = "Archives"
        pageRef = "archives"
    [[languages.en.menus.main]]
        identifier = "search"
        name = "Search"
        pageRef = "search"

[params]
  mainSections = ["posts"]
  ShowBreadCrumbs = true
  ShowReadingTime = true
  ShowWordCount = true
  ShowTotalWords = true
  hideSummary = true
  ShowToc = true
  TocOpen = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ogAutoCard = true
  ogCardFont = "og/plex-serif-cjk-subset.ttf"
  robotsNoIndex = true

  sgKicker = "COMPUTER AI Major / Class of '25"
  sgHomeTitle = "Notes & Projects"
  homePageSize = 10

  [params.homeInfoParams]
    title = "Dev & Design Journal"
    content = "전북대학교 컴퓨터인공지능학부 25학번 김초원의 개인 포트폴리오 사이트입니다."

  sgMotto = "Building digital experiences with code and design."
  sgReading = "Computer Architecture & Linux System"
  sgWriting = "Student Council & Tech Blog"
  sgExploring = "Vue.js, Hugo & Frontend Dev"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/chowone126"

[outputs]
  home = ["HTML", "RSS", "JSON", "JSONFeed", "LLMSTXT", "LLMSFULL"]

[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  minMatchCharLength = 2
  findAllMatches = true
  threshold = 0.2
  distance = 100
  ignoreLocation = true
  keys = ["title", "summary", "content", "tags"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        inline = [['\(', '\)']]
        block = [['$$', '$$'], ['\[', '\]']]
  [markup.highlight]
    noClasses = false# Portfolio Configuration updated for GitHub Pages
